# ESSI-FR training runs as `ubuntu` from a system service, outside any login
# session. With RemoveIPC=yes (logind's default) logind deletes all of that
# user's POSIX shared memory when the last SSH session closes -- and PyTorch
# DataLoader workers hand every batch over through shared memory. On
# 13 September 2026 this crashed training two seconds after an SSH logout:
#   RuntimeError: could not unlink the shared memory file /torch_... (ENOENT)
#
# Install:
#   sudo mkdir -p /etc/systemd/logind.conf.d
#   sudo cp ~/FRS/scripts/aws/logind-essi-train.conf /etc/systemd/logind.conf.d/essi-train.conf
#   sudo loginctl enable-linger ubuntu       # second layer: user never "fully logs out"
#   sudo systemctl restart systemd-logind
#
# Verify:
#   busctl get-property org.freedesktop.login1 /org/freedesktop/login1 org.freedesktop.login1.Manager RemoveIPC   # b false
#   loginctl show-user ubuntu -p Linger                                                                             # Linger=yes

[Login]
RemoveIPC=no
