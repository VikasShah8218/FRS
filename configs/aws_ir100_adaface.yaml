# Full-scale AWS run: IResNet-100 + AdaFace on a large dataset.
#
# See docs/AWS.md for instance selection, data staging and launch commands.
#
#   Single GPU : python -m scripts.train --config configs/aws_ir100_adaface.yaml
#   Multi-GPU  : torchrun --nproc_per_node=4 -m scripts.train --config configs/aws_ir100_adaface.yaml
#
# Sized for an A10G (24 GB). On an A100 (40 GB) raise batch_size to 256 and lr
# proportionally -- LR scales linearly with TOTAL batch across all GPUs.

_base_: base.yaml

experiment:
  name: ms1mv3_ir100_adaface
  seed: 3407

data:
  adapter:
    # MS1MV3 / Glint360K / WebFace4M ship as .rec + .idx packs. This reader has
    # no mxnet dependency (mxnet has no Python 3.13 wheel).
    type: mxnet_rec
    root: /mnt/data/ms1mv3
    min_images_per_identity: 0
  input_size: [112, 112]
  resize_policy: center_crop_112   # .rec packs are already 112x112

  batch_size: 128                  # PER GPU on a 24 GB A10G
  num_workers: 10                  # Linux forks: no __main__ guard constraint
  persistent_workers: true
  prefetch_factor: 6
  pin_memory: true

model:
  backbone:
    arch: ir_100
    channels_last: true
  head:
    type: adaface
    scale: 64.0
    m: 0.4
    h: 0.333
    t_alpha: 0.01
    partial_fc:
      enabled: auto                # on above 300k classes
      sample_rate: 0.1

optim:
  type: sgd
  lr: 0.2                          # linear rule from the ArcFace ref (0.1 @ 256)
  momentum: 0.9
  weight_decay: 5.0e-4
  no_wd_on_bn_and_bias: true
  clip_grad_norm: 5.0

scheduler:
  type: polylr
  warmup_epochs: 2                 # mandatory at total batch >= 512
  warmup_start_factor: 0.1
  power: 2.0

train:
  epochs: 20                       # 16 recovers ~99% of accuracy at 80% cost
  amp: true
  amp_dtype: float16
  grad_accum_steps: 1
  log_every_n_steps: 50
  save_every_n_epochs: 1
  save_every_n_steps: 2000         # mid-epoch saves: spot-instance safety
  eval_every_n_epochs: 1
  keep_last_n_checkpoints: 3
  resume: auto
  torch_compile: true              # 20-30% on A10G/A100; auto-off on Windows

eval:
  # Standard InsightFace evaluation packs -- comparable to published numbers.
  targets:
    - {name: lfw,      type: bin, path: /mnt/data/eval/lfw.bin}
    - {name: cfp_fp,   type: bin, path: /mnt/data/eval/cfp_fp.bin}
    - {name: agedb_30, type: bin, path: /mnt/data/eval/agedb_30.bin}
  batch_size: 256
  flip_test: true
  primary: lfw

monitor:
  tensorboard: true
  histogram_every_n_steps: 2000
